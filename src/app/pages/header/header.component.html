<header class="main-header">
  <div class="header-container">
    <!-- Logo/Brand -->
    <div class="logo">
      <!-- Replace with your logo image if available -->
        <span class="logo-text">MusicApp</span>
      <!--</a>-->
    </div>

   <!-- Only shows when user is logged in -->
    <nav class="main-nav" *ngIf="isLoggedIn">
      <a routerLink="/search">Search</a>
      <a routerLink="/favorites">Favorites</a>
      <a routerLink="/history">History</a>
    </nav>
    <!-- User Actions -->
    <div class="user-actions">
      <ng-container *ngIf="isLoggedIn; else loginButton">

        <!-- User Menu -->
        <div class="user-menu">
          <span class="user-name">{{ currentUser?.username || currentUser?.email }}</span>
          <button class="btn btn-logout" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        </div>

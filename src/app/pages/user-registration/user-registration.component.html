<!-- user-registration.component.html -->
<div class="registration-container">
  <div class="registration-section">
    <h1>User Registration</h1>
    
    <!-- Error Message -->
    <div class="error-banner" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="registration-form">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email"
          type="email" 
          class="form-input"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="isFieldInvalid('email')">
        <div *ngIf="isFieldInvalid('email')" class="error-message">
          Please enter a valid email address
        </div>
      </div>

      <!-- Username Field -->
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          id="username"
          type="text" 
          class="form-input"
          formControlName="username"
          placeholder="Choose a username"
          [class.error]="isFieldInvalid('username')">
        <div *ngIf="isFieldInvalid('username')" class="error-message">
          Username must contain only English characters and numbers, cannot start with a number
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          type="password" 
          class="form-input"
          formControlName="password"
          placeholder="Create a strong password"
          [class.error]="isFieldInvalid('password')">
        <div *ngIf="isFieldInvalid('password')" class="error-message">
          Password must contain at least 1 uppercase letter, 1 number, and no spaces
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="registrationForm.invalid || isSubmitting"
        class="submit-btn">
        <span *ngIf="!isSubmitting">Register</span>
        <span *ngIf="isSubmitting">Registering...</span>
      </button>

      <!-- Login Link -->
      <div class="login-link">
        Already have an account? <a routerLink="/login">Sign in</a>
      </div>
    </form>
  </div>
</div>

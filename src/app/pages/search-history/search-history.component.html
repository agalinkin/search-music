<!-- search-history.component.html -->
<div class="history-container">
  <div class="history-header">
    <h1>🔍 Search History</h1>
  </div>

  <ng-container *ngIf="(history$ | async) as history">
    <!-- Empty State -->
    <div class="empty-state" *ngIf="history.length === 0">
      <div class="empty-icon">📝</div>
      <h2>No search history yet</h2>
      <p>Your recent searches will appear here</p>
      <button class="browse-button" routerLink="/search">
        Start Searching
      </button>
    </div>

    <!-- History List -->
    <div *ngIf="history.length > 0">
      <div class="history-actions">
        <p class="history-count">{{ history.length }} recent search{{ history.length !== 1 ? 'es' : '' }}</p>
        <button class="clear-button" (click)="clearAllHistory()">
          Clear All
        </button>
      </div>

      <div class="history-list">
        <div 
          *ngFor="let item of history" 
          class="history-item"
          (click)="onHistoryItemClick(item)"
        >
          <div class="history-icon">🔍</div>
          
          <div class="history-content">
            <div class="history-query">{{ item.query }}</div>
            <div class="history-meta">
              <span class="results-count">
                {{ item.resultsCount }} result{{ item.resultsCount !== 1 ? 's' : '' }}
              </span>
              <span class="time-ago">{{ formatDate(item.timestamp) }}</span>
            </div>
          </div>

          <button 
            class="remove-button" 
            (click)="removeHistoryItem(item.query, $event)"
            title="Remove from history"
          >
            ✕
          </button>
        </div>
      </div>
    </div>
  </ng-container>
</div>
